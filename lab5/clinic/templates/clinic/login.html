<!DOCTYPE html>
<html>
<head>
    <title>Увійти</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .panel { background: #f0f0f0; padding: 20px; border-radius: 5px; max-width: 300px; margin: 0 auto; }
        .form-control { margin-bottom: 10px; width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px; background: blue; color: white; border: none; border-radius: 3px; cursor: pointer; width: 100%; }
        button:hover { background: darkblue; }
        .errorlist { color: red; list-style-type: none; padding: 0; }
    </style>
</head>
<body>
    <div class="panel">
        <h2>Увійти до системи</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
                <div>
                    {{ field.label_tag }}<br>
                    {{ field }}
                    {{ field.errors }}
                </div><br>
            {% endfor %}
            <button type="submit">Увійти</button>
        </form>
        <br>
        <p align="center"><a href="{% url 'index' %}">Повернутися на головну</a></p>
    </div>
</body>
</html>
